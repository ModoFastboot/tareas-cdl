<style>
* {
  margin: 0;

  box-sizing: border-box;

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

body.dark-mode {

body.dark-mode .header,
body.dark-mode .input-section,
body.dark-mode .urgency-category,

body.dark-mode .header p,
body.dark-mode .form-group label,

body.dark-mode .form-group input,

.theme-toggle {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: white;
  border: none;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  cursor: pointer;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, background 0.3s;
  z-index: 1000;
}

.theme-toggle:hover {
  transform: scale(1.1);
}

.theme-toggle:active {
  transform: scale(0.95);
}

body.dark-mode .theme-toggle {
  background: #2a2a2a;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

.header {
  background: white;
  padding: 1.5rem;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  margin-bottom: 2rem;
}

.header h1 {
  font-size: 28px;
  color: #2d3748;
  margin-bottom: 0.25rem;
}

.header p {
  color: #718096;
  font-size: 14px;
}

.input-section {
  background: white;
  padding: 1.5rem;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  margin-bottom: 2rem;
}

.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: #4a5568;
  margin-bottom: 0.5rem;
}

.form-group input, .form-group select {
  width: 100%;
  padding: 0.75rem;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  font-size: 15px;
  transition: border-color 0.2s;
}

.form-group input:focus, .form-group select:focus {
  outline: none;
  border-color: #00bcd4;
}

.btn {
  background: linear-gradient(135deg, #00bcd4 0%, #7b1fa2 100%);
  color: white;
  border: none;
  padding: 0.75rem 2rem;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 500;

  transition: transform 0.2s;
  width: 100%;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0);
}

.tasks-section {
  display: grid;
  gap: 1.5rem;
}

.urgency-category {
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  padding: 1.5rem;
}

.urgency-category h2 {
  font-size: 20px;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.urgency-badge {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
}

.urgency-urgent {
  background: #fee;
  color: #c53030;
  border-left: 4px solid #c53030;
}

.urgency-important {
  background: #fef5e7;
  color: #d97706;
  border-left: 4px solid #d97706;
}

.urgency-normal {
  background: #e6f2ff;
  color: #2b6cb0;
  border-left: 4px solid #2b6cb0;
}

.urgency-low {
  background: #f0f4f8;
  color: #718096;
  border-left: 4px solid #718096;
}

.task-item {
  background: #f7fafc;
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 0.75rem;
  display: flex;
  justify-content: space-between;
  align-items: center;

}

.task-item:hover {

.task-content {

.task-title {
  font-weight: 500;

.task-date {

}

.task-reminder-badge {

.task-calendar-badge {

.btn-complete, .btn-delete {

.btn-complete {

.empty-state {

.stats {

.stat-card {

.stat-card:hover {

.stat-card:active {

.stat-card.active {

.stat-number {

.filter-banner-text {

.filter-clear-btn:hover {

body.dark-mode .filter-banner-text {

.task-item.hidden {

/* Nuevos estilos para recordatorios y calendario */
#reminderSection, #calendarSection {

.reminder-options {

.checkbox-group:hover {

body.dark-mode .checkbox-group {

}

body.dark-mode .checkbox-group:hover {

}

.calendar-connect-btn {

.calendar-connected {

  padding: 0.5rem 1rem;
  border-radius: 6px;
  color: white;
  font-size: 13px;

  margin-top: 0.5rem;

</style>

<body>

<div class="container">
  <div class="header">

      <div style="width: 48px; height: 48px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 2px;">

        <div style="background: #7b1fa2; border-radius: 2px;"></div>
        <div style="background: #00bcd4; border-radius: 2px;"></div>
        <div style="background: #7b1fa2; border-radius: 2px;"></div>
        <div style="background: #00bcd4; border-radius: 2px;"></div>
        <div style="background: #00bcd4; border-radius: 2px;"></div>
        <div style="background: #7b1fa2; border-radius: 2px;"></div>
        <div style="background: #00bcd4; border-radius: 2px;"></div>
        <div style="background: transparent;"></div>

      </div>
      <h1 style="flex: 1;">Administrador de Tareas</h1>
      <button onclick="refreshTasks()" style="background: linear-gradient(135deg, #00bcd4 0%, #7b1fa2 100%); color: white; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;">
        🔄 Refrescar
      </button>
    </div>
    <p>Sergio @ Cdl</p>
    <div id="calendarStatus"></div>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card" onclick="filterTasks('all')" id="statAll">
      <div class="stat-number" id="totalTasks">0</div>
      <div class="stat-label">Total de Tareas</div>
    </div>
    <div class="stat-card" onclick="filterTasks('pending')" id="statPending">
      <div class="stat-number" id="pendingTasks">0</div>
      <div class="stat-label">Pendientes</div>
    </div>
    <div class="stat-card" onclick="filterTasks('completed')" id="statCompleted">
      <div class="stat-number" id="completedTasks">0</div>
      <div class="stat-label">Completadas</div>
    </div>
  </div>

  <div id="filterBanner" style="display: none;"></div>

  <div class="input-section">
    <form id="taskForm">
      <div class="form-group">
        <label for="taskTitle">Título de la tarea</label>
        <input type="text" id="taskTitle" placeholder="Ej: Llamar a cliente..." required>
      </div>
      
      <div class="form-group">
        <label for="taskUrgency">Nivel de urgencia</label>
        <select id="taskUrgency" required onchange="toggleReminderSection()">
          <option value="urgent">🔴 Urgente - Requiere atención inmediata</option>
          <option value="important">🟠 Importante - Prioridad alta</option>
          <option value="normal" selected>🔵 Normal - Prioridad media</option>
          <option value="low">⚪ Baja - Puede esperar</option>
        </select>

      <!-- Recordatorio rápido (solo para urgentes) -->
      <div id="reminderSection">

          ⏰ Recordarme en:

        <div class="reminder-options">

  <span id="themeIcon">🌙</span>

<!-- Google Calendar API -->
<script src="https://apis.google.com/js/api.js"></script>

<script>
let tasks = [];
let isLoading = true;
let darkMode = false;
let currentFilter = 'all';
let notificationPermission = false;
let calendarConnected = false;
let activeReminders = []; // Timers activos

// ============================================
// CONFIGURACIÓN - Pegá acá tu URL del Apps Script
// ============================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhpWrfIpF3lxDsK-TDVq8USWtx0KEATyhs6TAwekOqT6rD6cX0xI7OMmp4Mu9Gu4SPAQ/exec';

// Google Calendar API Configuration
// DEJÁ ESTOS COMENTADOS HASTA QUE CONFIGURES GOOGLE CALENDAR
// Cuando tengas las credenciales, descomentá y pegá tus valores
const CALENDAR_CLIENT_ID = '155850218957-g5dhhdtkolilrjntmc86dalv8di7vfmr.apps.googleusercontent.com';
const CALENDAR_API_KEY = 'AIzaSyCrod1HVVmQD8ZzWD0xn2VReuLvTMBbfd0';
const CALENDAR_DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
const CALENDAR_SCOPES = 'https://www.googleapis.com/auth/calendar.events';
// ============================================

// Pedir permisos de notificaciones al cargar
async function requestNotificationPermission() {
  if ('Notification' in window) {
    const permission = await Notification.requestPermission();
    notificationPermission = permission === 'granted';
    
    if (notificationPermission) {
      console.log('Notificaciones habilitadas');
    } else {
      console.log('Notificaciones denegadas');
    }
  }
}

// Mostrar/ocultar sección de recordatorio
function toggleReminderSection() {
  const urgency = document.getElementById('taskUrgency').value;
  const reminderSection = document.getElementById('reminderSection');
  
  if (urgency === 'urgent') {
    reminderSection.style.display = 'block';
  } else {
    reminderSection.style.display = 'none';
    // Reset reminder selection
    document.getElementById('rem0').checked = true;
  }
}

// Mostrar/ocultar sección de calendario
function toggleCalendarSection() {
  const checkbox = document.getElementById('enableCalendar');
  const section = document.getElementById('calendarSection');
  
  checkbox.checked = !checkbox.checked;
  section.style.display = checkbox.checked ? 'block' : 'none';
  
  // Mostrar botón de conectar si no está conectado
  if (checkbox.checked && !calendarConnected) {
    document.getElementById('connectCalendarBtn').style.display = 'block';
  }
}

// Crear recordatorio
function scheduleReminder(task, minutes) {
  if (minutes === 0 || !notificationPermission) return;
  
  const timeoutId = setTimeout(() => {
    new Notification('🔴 Tarea Urgente - Tareas Cdl', {
      body: task.title,
      icon: 'icon-192.png',
      badge: 'icon-192.png',
      tag: `task-${task.id}`,
      requireInteraction: true
    });
  }, minutes * 60 * 1000);
  
  activeReminders.push({
    taskId: task.id,
    timeoutId: timeoutId
  });
  
  return timeoutId;
}

// Cancelar recordatorio
function cancelReminder(taskId) {
  const reminder = activeReminders.find(r => r.taskId === taskId);
  if (reminder) {
    clearTimeout(reminder.timeoutId);
    activeReminders = activeReminders.filter(r => r.taskId !== taskId);
  }
}

// ============================================
// GOOGLE CALENDAR INTEGRATION
// ============================================

let tokenClient;
let gapiInited = false;
let gisInited = false;

// Inicializar Google API
function gapiLoaded() {
  gapi.load('client', initializeGapiClient);
}

async function initializeGapiClient() {
  if (!CALENDAR_CLIENT_ID.includes('TU_CLIENT_ID_AQUI')) {
    await gapi.client.init({
      apiKey: CALENDAR_API_KEY,
      discoveryDocs: [CALENDAR_DISCOVERY_DOC],
    });
    gapiInited = true;
    maybeEnableButtons();
  }
}

// Inicializar Google Identity Services
function gisLoaded() {
  if (!CALENDAR_CLIENT_ID.includes('TU_CLIENT_ID_AQUI')) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CALENDAR_CLIENT_ID,
      scope: CALENDAR_SCOPES,
      callback: '', // definido al momento de solicitar token
    });
    gisInited = true;
    maybeEnableButtons();
  }
}

function maybeEnableButtons() {
  if (gapiInited && gisInited) {
    document.getElementById('connectCalendarBtn').style.display = 'inline-block';
  }
}

// Conectar con Google Calendar
function connectGoogleCalendar() {
  tokenClient.callback = async (resp) => {
    if (resp.error !== undefined) {
      throw (resp);
    }
    calendarConnected = true;
    document.getElementById('calendarStatus').innerHTML = 
      '<div class="calendar-connected">✓ Conectado a Google Calendar</div>';
    document.getElementById('connectCalendarBtn').style.display = 'none';
  };

  if (gapi.client.getToken() === null) {
    tokenClient.requestAccessToken({prompt: 'consent'});
  } else {
    tokenClient.requestAccessToken({prompt: ''});
  }
}

// Crear evento en Google Calendar
async function createCalendarEvent(task) {
  if (!calendarConnected || !task.eventDate || !task.eventTime) {
    return;
  }

  try {
    const startDateTime = new Date(`${task.eventDate}T${task.eventTime}`);
    const endDateTime = new Date(startDateTime.getTime() + (60 * 60 * 1000)); // +1 hora

    const event = {
      'summary': task.title,
      'description': `Tarea creada desde Tareas Cdl\nUrgencia: ${task.urgency}`,
      'start': {
        'dateTime': startDateTime.toISOString(),
        'timeZone': 'America/Argentina/Buenos_Aires'
      },
      'end': {
        'dateTime': endDateTime.toISOString(),
        'timeZone': 'America/Argentina/Buenos_Aires'
      },
      'reminders': {
        'useDefault': false,
        'overrides': [
          {'method': 'popup', 'minutes': task.calendarReminder || 15}
        ]
      }
    };

    const request = await gapi.client.calendar.events.insert({
      'calendarId': 'primary',
      'resource': event
    });

    task.calendarEventId = request.result.id;
    console.log('Evento creado en Calendar:', request.result.htmlLink);
    
  } catch (error) {
    console.error('Error al crear evento en Calendar:', error);
  }
}

// Función para filtrar tareas
function filterTasks(filter) {
  currentFilter = filter;
  
  document.getElementById('statAll').classList.remove('active');
  document.getElementById('statPending').classList.remove('active');
  document.getElementById('statCompleted').classList.remove('active');
  
  const filterBanner = document.getElementById('filterBanner');
  
  if (filter === 'all') {
    filterBanner.style.display = 'none';
    document.querySelectorAll('.task-item').forEach(item => {
      item.classList.remove('hidden');
    });
    document.getElementById('statAll').classList.add('active');
    document.querySelector('.tasks-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    
  } else if (filter === 'pending') {
    document.getElementById('statPending').classList.add('active');
    filterBanner.style.display = 'block';
    filterBanner.className = 'filter-banner';
    filterBanner.innerHTML = `
      <span class="filter-banner-text">📋 Mostrando solo tareas pendientes</span>
      <button class="filter-clear-btn" onclick="filterTasks('all')">✕ Ver todas</button>
    `;
    
    document.querySelectorAll('.task-item').forEach(item => {
      if (item.classList.contains('task-completed')) {
        item.classList.add('hidden');
      } else {
        item.classList.remove('hidden');
      }
    });
    
    filterBanner.scrollIntoView({ behavior: 'smooth', block: 'start' });
    
  } else if (filter === 'completed') {
    document.getElementById('statCompleted').classList.add('active');
    filterBanner.style.display = 'block';
    filterBanner.className = 'filter-banner';
    filterBanner.innerHTML = `
      <span class="filter-banner-text">✅ Mostrando solo tareas completadas</span>
      <button class="filter-clear-btn" onclick="filterTasks('all')">✕ Ver todas</button>
    `;
    
    document.querySelectorAll('.task-item').forEach(item => {
      if (item.classList.contains('task-completed')) {
        item.classList.remove('hidden');
      } else {
        item.classList.add('hidden');
      }
    });
    
    filterBanner.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

    applyTheme();
  }
}

function saveTheme() {

// Toggle tema
document.getElementById('themeToggle').addEventListener('click', function() {

// Cargar tareas desde Google Sheets
async function loadTasks() {
  if (!SCRIPT_URL || SCRIPT_URL === 'TU_URL_DE_APPS_SCRIPT_AQUI') {
    alert('Por favor configurá la URL del Apps Script en el código');
    return;
  }
  
  try {
    const response = await fetch(SCRIPT_URL + '?action=get');
    const data = await response.json();
    
    if (data.status === 'success') {
      tasks = data.tasks || [];
      
      // Reactivar recordatorios pendientes
      tasks.forEach(task => {
        if (task.reminderMinutes && !task.completed) {
          const createdTime = new Date(task.createdAt).getTime();
          const now = new Date().getTime();
          const elapsed = Math.floor((now - createdTime) / (60 * 1000));
          const remaining = task.reminderMinutes - elapsed;
          
          if (remaining > 0) {
            scheduleReminder(task, remaining);
          }
        }
      });
    }
  } catch (error) {
    console.error('Error al cargar tareas:', error);
    alert('Error al conectar con Google Sheets. Verificá tu conexión.');
  }
  
  isLoading = false;
  renderTasks();
}

// Guardar tareas en Google Sheets
async function saveTasks() {
  if (!SCRIPT_URL || SCRIPT_URL === 'TU_URL_DE_APPS_SCRIPT_AQUI') {
    return;
  }
  
  try {
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'save', tasks: tasks })
    });
    
    const data = await response.json();
    
    if (data.status !== 'success') {
      throw new Error('Error al guardar');
    }
  } catch (error) {
    console.error('Error al guardar tareas:', error);
    alert('Hubo un problema al guardar la tarea. Por favor intentá de nuevo.');
  }
}

// Agregar nueva tarea
document.getElementById('taskForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const title = document.getElementById('taskTitle').value;
  const urgency = document.getElementById('taskUrgency').value;
  const reminderMinutes = urgency === 'urgent' ? 
    parseInt(document.querySelector('input[name="reminder"]:checked').value) : 0;
  
  // Datos de calendario
  const enableCalendar = document.getElementById('enableCalendar').checked;
  const eventDate = enableCalendar ? document.getElementById('eventDate').value : null;
  const eventTime = enableCalendar ? document.getElementById('eventTime').value : null;
  const calendarReminder = enableCalendar ? 
    parseInt(document.getElementById('calendarReminder').value) : 15;
  
  const task = {
    id: Date.now(),
    title: title,
    urgency: urgency,
    completed: false,
    createdAt: new Date().toISOString(),
    reminderMinutes: reminderMinutes,
    eventDate: eventDate,
    eventTime: eventTime,
    calendarReminder: calendarReminder,
    calendarEventId: null
  };
  
  tasks.push(task);
  
  // Programar recordatorio si aplica
  if (reminderMinutes > 0) {
    scheduleReminder(task, reminderMinutes);
  }
  
  // Crear evento en Calendar si aplica
  if (enableCalendar && eventDate && eventTime) {
    await createCalendarEvent(task);
  }
  
  await saveTasks();
  renderTasks();
  
  // Limpiar formulario
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskUrgency').value = 'normal';
  document.getElementById('rem0').checked = true;
  document.getElementById('enableCalendar').checked = false;
  document.getElementById('eventDate').value = '';
  document.getElementById('eventTime').value = '';
  document.getElementById('reminderSection').style.display = 'none';
  document.getElementById('calendarSection').style.display = 'none';
});

// Renderizar todas las tareas
function renderTasks() {
  document.getElementById('urgentTasks').innerHTML = '';
  document.getElementById('importantTasks').innerHTML = '';
  document.getElementById('normalTasks').innerHTML = '';
  document.getElementById('lowTasks').innerHTML = '';
  
  const urgent = tasks.filter(t => t.urgency === 'urgent');
  const important = tasks.filter(t => t.urgency === 'important');
  const normal = tasks.filter(t => t.urgency === 'normal');
  const low = tasks.filter(t => t.urgency === 'low');
  
  renderCategory('urgentTasks', urgent);
  renderCategory('importantTasks', important);
  renderCategory('normalTasks', normal);
  renderCategory('lowTasks', low);
  
  updateStats();
  
  if (currentFilter !== 'all') {
    filterTasks(currentFilter);
  }
}

// Renderizar una categoría específica
function renderCategory(containerId, categoryTasks) {
  const container = document.getElementById(containerId);
  
  if (categoryTasks.length === 0) {
    container.innerHTML = '<div class="empty-state">No hay tareas en esta categoría</div>';
    return;
  }
  
  categoryTasks.forEach(task => {
    const taskEl = document.createElement('div');
    taskEl.className = 'task-item' + (task.completed ? ' task-completed' : '');
    
    let badges = '';
    if (task.reminderMinutes && task.reminderMinutes > 0 && !task.completed) {
      badges += `<span class="task-reminder-badge">⏰ Recordatorio en ${task.reminderMinutes} min</span>`;
    }
    if (task.eventDate && task.eventTime) {
      const eventDateTime = new Date(`${task.eventDate}T${task.eventTime}`);
      badges += `<span class="task-calendar-badge">📅 ${eventDateTime.toLocaleString('es-AR', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      })}</span>`;
    }
    
    taskEl.innerHTML = `
      <div class="task-content">
        <div class="task-title">${task.title}</div>
        <div class="task-date">${new Date(task.createdAt).toLocaleString('es-AR')}</div>
        ${badges}
      </div>
      <div class="task-actions">
        <button class="btn-complete" onclick="toggleComplete(${task.id})">
          ${task.completed ? '↺ Reactivar' : '✓ Completar'}
        </button>
        <button class="btn-delete" onclick="deleteTask(${task.id})">
          🗑 Eliminar
        </button>
      </div>
    `;
    
    container.appendChild(taskEl);
  });
}

// Marcar tarea como completada/pendiente
async function toggleComplete(taskId) {
  const task = tasks.find(t => t.id === taskId);
  if (task) {
    task.completed = !task.completed;
    
    // Cancelar recordatorio si se completa
    if (task.completed) {
      cancelReminder(taskId);
    }
    
    await saveTasks();
    renderTasks();
  }
}

// Eliminar tarea
async function deleteTask(taskId) {
  if (confirm('¿Estás seguro de que querés eliminar esta tarea?')) {
    cancelReminder(taskId);
    tasks = tasks.filter(t => t.id !== taskId);
    await saveTasks();
    renderTasks();
  }
}

// Actualizar estadísticas
function updateStats() {
  const total = tasks.length;
  const completed = tasks.filter(t => t.completed).length;
  const pending = total - completed;
  
  document.getElementById('totalTasks').textContent = total;
  document.getElementById('completedTasks').textContent = completed;
  document.getElementById('pendingTasks').textContent = pending;
}

// Botón de refrescar
function refreshTasks() {
  loadTasks();
}

// Cargar al iniciar
loadTheme();
requestNotificationPermission();
loadTasks();

// Cargar Google APIs
if (typeof gapi !== 'undefined') {
  gapiLoaded();
}
if (typeof google !== 'undefined') {
  gisLoaded();
}
